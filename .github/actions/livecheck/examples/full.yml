name: Livecheck

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Website Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Run Livecheck
        id: livecheck
        uses: Ibra106i/livecheck/.github/actions/livecheck@v1
        with:
          url: https://your-staging-site.com
          fail-on-failure: true
          min-score: 80
          probe-forms: true
          i-have-permission: true
          lighthouse: false
          ai: false
          timeout: 30000
          post-comment: true
          annotations: true

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.livecheck.outputs.markdown }}`;
            const score = `${{ steps.livecheck.outputs.score }}`;
            const pass = `${{ steps.livecheck.outputs.pass }}`;
            const marker = '<!-- livecheck -->';

            const statusEmoji = pass === 'true' ? '✅' : '❌';
            const statusText = pass === 'true' ? 'Passed' : 'Failed';
            const title = `## ${statusEmoji} Livecheck — Score: ${score}/100 (${statusText})`;
            const fullBody = `${marker}\n${title}\n\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              const { data: newComment } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              core.info(`Created new comment #${newComment.id}`);
            }

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecheck-report
          path: |
            livecheck-report/
          retention-days: 30

      - name: Fail workflow if audit failed
        if: steps.livecheck.outputs.pass == 'false'
        run: |
          echo "Livecheck audit failed with score ${{ steps.livecheck.outputs.score }}/100"
          exit 1
